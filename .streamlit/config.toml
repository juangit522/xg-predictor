# Config del servidor Streamlit (la lee tanto Streamlit Community Cloud
# como `streamlit run` local y el contenedor Docker).

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

# Tema "Pizarra de analista", el mismo del NFL Predictor para que ambas
# apps se vean como un solo sistema: papel crema, tinta casi negra y un
# unico acento color cuero. El CSS complementario vive en estilo.py.
[theme]
base = "light"
primaryColor = "#8C4A2A"              # cuero: unico acento
backgroundColor = "#FAF9F6"           # papel crema
secondaryBackgroundColor = "#F2EEE7"  # campos de formulario, tabs
textColor = "#1D1F22"                 # tinta
linkColor = "#8C4A2A"
borderColor = "#E8E4DC"
dataframeBorderColor = "#ECE8E0"
dataframeHeaderBackgroundColor = "#F5F2EC"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
headingFont = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
headingFontWeights = [700, 700, 600, 600, 600, 600]
metricValueFontWeight = 700

# Colores semanticos apagados (alertas, estados): verde y rojo discretos
greenColor = "#2E6A4D"
greenBackgroundColor = "#EEF5F0"
greenTextColor = "#2E6A4D"
redColor = "#9B3B33"
redBackgroundColor = "#F8EDEB"
redTextColor = "#9B3B33"
yellowColor = "#B07A1E"
yellowBackgroundColor = "#FBF3E2"
yellowTextColor = "#8A5A12"
blueColor = "#4A5A6A"
blueBackgroundColor = "#F1F2F2"
blueTextColor = "#3F4A55"
grayColor = "#6E6A63"
# El grafico 1X2 usa el primer color: que coincida con el acento.
chartCategoricalColors = ["#8C4A2A", "#6E6A63", "#2E6A4D", "#B07A1E", "#4A5A6A"]

[theme.sidebar]
backgroundColor = "#F3F0EA"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#E3DED4"
